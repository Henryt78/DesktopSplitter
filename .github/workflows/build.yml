name: Build DesktopSplitter

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- WDK
      # The runner image ships Visual Studio + Windows SDKs but NOT the WDK,
      # and not the "Windows Driver Kit" VS component that provides the
      # WindowsUserModeDriver10.0 platform toolset. Install both.
      # WDK 10.0.26100 ships build tasks only for VS 2022 (MSBuild 17). Newer
      # runner images default to VS 2026 (MSBuild 18), so pin VS 2022 if present.
      - name: Pick Visual Studio 2022
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -products * -property installationPath | ForEach-Object { Write-Host "::warning::VS install: $_" }
          $vs17 = & $vswhere -version '[17.0,18.0)' -requires Microsoft.Component.MSBuild -property installationPath
          if ($vs17) {
            Write-Host "Using VS 2022 at $vs17"
            "DS_VS_RANGE=[17.0,18.0)" >> $env:GITHUB_ENV
          } else {
            Write-Host "::warning::VS 2022 not found on this runner"
          }

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          # VS 2026 (MSBuild 18) needs WDK 10.0.28000+; 26100 only ships VS 2022 build tasks.
          # The WDK MSI also needs the matching Windows SDK.
          if ($env:DS_VS_RANGE) { $ver = '10.0.26100' } else { $ver = '10.0.28000' }
          function Show-Ids($q) {
            winget search $q --source winget --accept-source-agreements --disable-interactivity |
              Where-Object { $_ -match 'Microsoft\.Windows' } |
              ForEach-Object { Write-Host "::warning::winget $($q): $($_.Trim())" }
          }
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $haveSdk = Test-Path "$kits\$ver.*\um\windows.h"
          if ($ver -ne '10.0.26100' -and $haveSdk) {
            Write-Host "Windows SDK $ver already on the runner."
          } elseif ($ver -ne '10.0.26100') {
            winget install --id "Microsoft.WindowsSDK.$ver" --exact `
              --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0 -and (Test-Path "$kits\$ver.*\um\windows.h")) {
              Write-Host "::warning::SDK installer returned $LASTEXITCODE but the SDK is present; continuing."
              $global:LASTEXITCODE = 0
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::winget SDK $ver install failed ($LASTEXITCODE)"; Show-Ids 'WindowsSDK'; exit 1
            }
          }
          winget install --id "Microsoft.WindowsWDK.$ver" --exact `
            --accept-source-agreements --accept-package-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::winget WDK $ver install failed ($LASTEXITCODE)"; Show-Ids 'WindowsWDK'; exit 1
          }

      - name: Add WDK component to Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $range = if ($env:DS_VS_RANGE) { @('-version', $env:DS_VS_RANGE) } else { @() }
          $vs = & $vswhere -latest @range -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
            'modify', '--installPath', "`"$vs`"", `
            '--add', 'Component.Microsoft.Windows.DriverKit', `
            '--quiet', '--norestart'
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "VS modify failed ($($p.ExitCode))" }

      - name: Verify driver toolset present
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $range = if ($env:DS_VS_RANGE) { @('-version', $env:DS_VS_RANGE) } else { @() }
          $vs = & $vswhere -latest @range -requires Microsoft.Component.MSBuild -property installationPath
          $toolsets = Get-ChildItem "$vs\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*" -Directory |
            Select-Object -ExpandProperty Name
          Write-Host "Toolsets: $($toolsets -join ', ')"
          if ($toolsets -notcontains 'WindowsUserModeDriver10.0') {
            throw "WindowsUserModeDriver10.0 toolset missing after WDK install"
          }
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\um\iddcx\*\IddCx.h" |
            ForEach-Object { Write-Host "IddCx: $($_.FullName)" }

      # -------------------------------------------------------------- build
      # build.ps1 builds everything in order: driver (test-signed catalog),
      # compositor, devcreate, edidoverride, app publish, then the setup exe
      # that embeds all of it. Inf2CatUseLocalTime is already handled inside.
      # -NoVersionBump: the root VERSION file is the single source of truth and
      # is bumped by developers' local builds. CI must never increment it -
      # nothing here could commit the change back, so bumping would only cause
      # version drift and a dirty working tree.
      - name: Build all (Release)
        id: build
        shell: pwsh
        run: |
          .\build.ps1 -Configuration Release -NoVersionBump *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Surface build errors as public annotations (logs need auth to read).
      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Get-Content build.log | Select-String -Pattern 'error|exception|failed' |
              Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            Get-Content build.log -Tail 15 | ForEach-Object { Write-Host "::warning::$_" }
          }

      # -------------------------------------------------------------- check
      # CI runners execute elevated, so the shipping exe can run directly.
      # /verify inspects the embedded payload and signature without changing
      # anything; /selftest walks the wizard UI headlessly at several DPIs.
      - name: Installer self-checks
        shell: pwsh
        run: |
          $exe = "installer\setup\bin\x64\Release\DesktopSplitterSetup.exe"
          & $exe /verify   | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "/verify failed ($LASTEXITCODE)" }
          & $exe /selftest | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "/selftest failed ($LASTEXITCODE)" }

      # The real product version comes from the root VERSION file (build.ps1
      # also emits it as a step output and to build\generated\version.txt).
      # A v* tag still wins, so a tagged release is named after its tag.
      - name: Stamp artifact name
        id: stamp
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          if (-not $version) {
            $version = (Get-Content "build\generated\version.txt" -Raw).Trim()
          }
          if (-not $version) { throw "could not determine the product version" }

          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v')
            if ($tagVersion -ne $version) {
              Write-Warning "tag $tagVersion does not match VERSION $version - using the tag"
            }
            $version = $tagVersion
          }

          Write-Host "Product version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item "installer\setup\bin\x64\Release\DesktopSplitterSetup.exe" `
                    "DesktopSplitterSetup-$version.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSplitterSetup-${{ steps.stamp.outputs.version }}
          path: DesktopSplitterSetup-${{ steps.stamp.outputs.version }}.exe
          compression-level: 0

      # ------------------------------------------------------------ release
      # Every push to the default branch refreshes a rolling "latest" pre-
      # release; pushing a v* tag creates a real versioned release.
      - name: Update rolling "latest" release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ steps.stamp.outputs.version }})
          prerelease: true
          body: |
            Automatic build of commit ${{ github.sha }}.
            Unsigned development build — the installer will ask you to trust
            the development certificate. See README for details.
          files: DesktopSplitterSetup-${{ steps.stamp.outputs.version }}.exe

      - name: Create tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: DesktopSplitter ${{ github.ref_name }}
          files: DesktopSplitterSetup-${{ steps.stamp.outputs.version }}.exe
          generate_release_notes: true
